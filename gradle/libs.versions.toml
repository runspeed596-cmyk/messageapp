lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.12.2"
composeBom = "2024.09.00"
navigationCompose = "2.9.2"
ksp = "2.2.0-2.0.2"
retorift = "3.0.0"
okhttp = "5.1.0"
room = "2.7.2"
coil = "3.3.0"
hilt = "2.57.2"
