server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Admin panel location (hidden path)
    location /ca978112ca/ {
        alias /usr/share/nginx/html/ca978112ca/;
        try_files $uri $uri/ /ca978112ca/index.html;

        # Aggressive caching for hashed assets (immutable)
        location ~* /ca978112ca/assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Font caching
        location ~* /ca978112ca/fonts/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }
    }

    # Handle SPA routing for admin
    location /ca978112ca {
        return 301 /ca978112ca/;
    }

    # Gzip compression — aggressive
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;

    # Cache static assets (fallback for non-hashed files)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
