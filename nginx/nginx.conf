    # =============================================
    # کلاسور آنلاین — online.kelasorapp.ir (HTTP)
    # =============================================
    server {
        listen 80;
        server_name online.kelasorapp.ir;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # API endpoints for kelasor-online
        location /api/kelasor-online/ {
            proxy_pass http://api/api/kelasor-online/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Portal (login page) — exact root path and portal assets
        location = / {
            proxy_pass http://kelasor-online/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /index.html {
            proxy_pass http://kelasor-online/index.html;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /style.css {
            proxy_pass http://kelasor-online/style.css;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /app.js {
            proxy_pass http://kelasor-online/app.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Room page (Jitsi IFrame API wrapper)
        location = /room.html {
            proxy_pass http://kelasor-online/room.html;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /room.js {
            proxy_pass http://kelasor-online/room.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /room.css {
            proxy_pass http://kelasor-online/room.css;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Jitsi BOSH / WebSocket connection
        location = /http-bind {
            proxy_pass http://jitsi-web/http-bind;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /xmpp-websocket {
            proxy_pass http://jitsi-web/xmpp-websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Colibri WebSocket (JVB)
        location /colibri-ws {
            proxy_pass http://jitsi-web/colibri-ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Everything else → Jitsi Web (room names, static assets)
        location / {
            proxy_pass http://jitsi-web/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

