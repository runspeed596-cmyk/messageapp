spring.application.name=MessageApp
server.address=0.0.0.0
server.port=8080
spring.jpa.database=POSTGRESQL
spring.sql.init.platform=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messageapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
jwt.secret=${JWT_SECRET:2Qw1Qk5vQ2p6b3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGQ=}

# File upload settings
app.base-url=${APP_BASE_URL:http://192.168.70.113:8080}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Najva SMS
najva.sms.api-key=${NAJVA_SMS_API_KEY:704dec0108417545ac307223e524be953849fb73617188fbba}
najva.sms.sender=90003724
najva.sms.template-name=opt
najva.sms.base-url=https://sms.najva.com/v1
# To enable real SMS, change this to true
najva.sms.enabled=${NAJVA_SMS_ENABLED:false}

# ─── HikariCP Connection Pool ───
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# ─── Redis Configuration ───
redis.enabled=${REDIS_ENABLED:false}
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.max-memory=512mb

# ─── MinIO Configuration ───
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}

# ─── Netty WebSocket Server ───
netty.port=${NETTY_PORT:9090}
netty.boss-threads=2
netty.worker-threads=14
