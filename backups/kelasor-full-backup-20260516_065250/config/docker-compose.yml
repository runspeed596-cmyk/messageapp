services:
  # =============================================
  # PostgreSQL Database — پایگاه داده
  # =============================================
  postgres:
    image: postgres:15-alpine
    container_name: messageapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messageapp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messageapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-messageapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # Redis Cache + Pub/Sub — کش و پیام‌رسانی
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: messageapp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - messageapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # =============================================
  # MinIO S3 Object Storage — ذخیره‌سازی فایل
  # =============================================
  minio:
    image: minio/minio
    container_name: messageapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - messageapp-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - "9000"
      - "9001"

  # =============================================
  # Spring Boot API + Netty WebSocket — بکند
  # =============================================
  api:
    build:
      context: ./SpringBoot
      dockerfile: Dockerfile
    container_name: messageapp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-messageapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      APP_BASE_URL: ${APP_BASE_URL:-http://185.116.162.68}
      JWT_SECRET: ${JWT_SECRET:-2Qw1Qk5vQ2p6b3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGd2d2h5b2J6d3J4bGQ=}
      NAJVA_SMS_API_KEY: ${NAJVA_SMS_API_KEY:-YOUR_API_KEY_HERE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      NETTY_PORT: 9090
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "sms.najva.com:185.166.104.6"
    dns:
      - 178.22.122.100
      - 185.51.200.2
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - messageapp-network
    expose:
      - "8080"
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =============================================
  # Admin Panel (React + Nginx) — پنل مدیریت
  # =============================================
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${APP_BASE_URL:-http://185.116.162.68}/api
    container_name: messageapp-admin
    restart: unless-stopped
    networks:
      - messageapp-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =============================================
  # Nginx Reverse Proxy — پراکسی معکوس
  # =============================================
  nginx:
    image: nginx:alpine
    container_name: messageapp-nginx
    restart: unless-stopped
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
      - "9090:9090"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/intro.html:/usr/share/nginx/html/index.html:ro
      - uploads_data:/app/uploads:ro
      - ./ssl:/etc/ssl/server:ro
    networks:
      - messageapp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# =============================================
# Volumes — حجم‌های داده
# =============================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# =============================================
# Networks — شبکه داخلی
# =============================================
networks:
  messageapp-network:
    driver: bridge
